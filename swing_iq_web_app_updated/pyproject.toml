[project]
name = "swing-iq-stock-screener"
version = "1.0.0"
description = "Interactive NSE swing stock screening and analysis platform"
requires-python = "~=3.12.0"
dependencies = [
    "Flask>=3.0,<4",
    "yfinance>=0.2.50",
    "pandas>=2.2,<3",
    "numpy>=1.26,<3"
]

[tool.vercel]
entrypoint = "swing_stock_web_app:app"